name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_LOG_LEVEL: info

      - name: Deploy to GitHub Pages (static export)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      # -----------------------------------------------------------------------
      # Extension point: add your deployment steps here.
      # Examples:
      #   - Vercel: use amondnet/vercel-action
      #   - Netlify: use nwtgck/actions-netlify
      #   - Docker: build and push to registry, then deploy to Kubernetes/ECS
      #   - Firebase Hosting: use FirebaseExtended/action-hosting-deploy
      # -----------------------------------------------------------------------
